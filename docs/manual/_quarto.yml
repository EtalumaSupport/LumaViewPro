project:
  type: book
quarto-required: "1.11.9"
book:
  title: "LumaViewPro Manual"
  subtitle: "Software for Etaluma Lumascope microscopes"
  date: today
  date-format: "MMMM D, YYYY"
  output-file: "LumaViewPro-Manual"
  chapters:
    - index.qmd
    - setting-up.qmd
    - installing.qmd
    - tour.qmd
    - settings.qmd
    - channels.qmd
    - focus.qmd
    - getting-an-image.qmd
    - protocols.qmd
    - post-processing.qmd
    - incubator.qmd
  appendices:
    - quick-start.qmd
    - sanitizing.qmd
    - windows-timelapse.qmd
    - extending.qmd
    - custom-labware.qmd
manual-version: "4.x"
filters:
  - style/guilabel.lua
format:
  typst:
    toc: true
    toc-depth: 2
    papersize: us-letter
    font-paths: [fonts]
    template-partials:
      - style/typst-show.typ
