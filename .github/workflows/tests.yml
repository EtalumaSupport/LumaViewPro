# Test + lint gate. Before this existed nothing ran the suite automatically:
# the only gate was a pre-commit hook on one developer's machine, which vets
# nothing from the seven-plus outside authors who open pull requests against
# this public repo.
#
# Reports, does not block. Branch protection is a separate decision.
#
# Targets 4.0.0-beta and the dev/4.0.0 trunk. `tools/check_rules.py` does not
# exist on `main` yet, so a `main` job today would fail for the wrong reason
# and teach everyone to ignore it. Add `main` when 4.0.0 promotes.
#
# Two depths. A push to the trunk gets the FAST check: one Python, 3.13,
# every test not marked slow -- a clean Linux checkout that installs, imports
# and passes, in minutes. The local push suite already ran every test on the
# other interpreter (its summary names which). The FULL suite, every test on
# both Pythons, runs on a push to 4.0.0-beta, on a pull request, and nightly
# on the trunk: `nightly.yml` on main calls this file with `full`, because
# GitHub schedules only from the default branch. A slow, shared runner is
# where timing races show (a z-stack's autofocus centred on the floor,
# 2026-11-02, was found only here), so the full depth still runs every day;
# on every push it cost 45-50 minutes a run, and the next push cancelled most
# of them. A failed run emails the pusher. Only the newest push's run is
# wanted, so a newer push on the same branch cancels the run in progress.
#
# FIRST-RUN RISK, named in advance so a red first run is diagnosed rather than
# guessed at. It cannot be settled without executing this on a real runner,
# and it is not worth pre-emptively patching: the ids-peak wheels have never
# been installed on Linux anywhere, and this job is the first place that gets
# tested -- which is part of why it exists. If a wheel has no manylinux build,
# split the camera SDKs into a separate optional requirements file rather than
# dropping the whole install step, so the rest of the install still gets
# exercised.
#
# NOT a risk, though it looks like one: pyenchant needs the system libenchant
# library on Linux, which this runner does not have. It installs anyway -- the
# package is a ctypes wrapper that loads the C library at IMPORT time, not
# install time -- and nothing here imports it. We never import enchant
# ourselves; only Kivy's spelling provider does, and conftest replaces kivy
# with a MagicMock, so that provider never loads under pytest. pyenchant is in
# requirements.txt purely to keep a CRITICAL line out of the app and
# PyInstaller logs. Do not add an apt step for it.

name: tests

on:
  push:
    branches: [4.0.0-beta, dev/4.0.0]
  pull_request:
    branches: [4.0.0-beta]
  workflow_call:
    inputs:
      ref:
        description: The branch to check out and test.
        type: string
        required: true

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung run ends here, not at GitHub's six-hour default: on 2026-10-30
    # both jobs reached 99% in 53 minutes and then sat silent for four hours.
    timeout-minutes: 90
    # 3.12 is the FLOOR: the oldest interpreter we promise to work on, so it
    # fails first. 3.13 is the newest the installers accept and what
    # development runs.
    # Keep the floor in step with scripts/_find_python.py, both install
    # scripts, and lumaviewpro.py's startup gate; a dependency floor that
    # outruns these is what made this job unable to install anything at all.
    # fail-fast off: a red on one interpreter must not cancel the other's
    # answer. A trunk push runs 3.13 alone (the header), its test files
    # split across four jobs, shard 0 to 3, so the answer comes in minutes;
    # a full run is one job per interpreter, shard `all`.
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/dev/4.0.0' && '["3.13"]' || '["3.12", "3.13"]') }}
        shard: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/dev/4.0.0' && '["0", "1", "2", "3"]' || '["all"]') }}
    env:
      # The fast check's selection; empty selects every test.
      MARKS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev/4.0.0' && 'not slow' || '' }}
      SHARDS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty for a push or pull request: the commit that triggered it.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The firmware-backed simulator runs the real board firmware inside
      # MicroPython. The Linux runtime is built here from the pinned upstream
      # source rather than committed (the macOS one is committed); the script
      # reads the pin and applies the same patches either way.
      - name: Simulator runtime
        run: drivers/sim_wire/runtime/build_sim_runtime.sh

      # No extra -q: pyproject addopts already carries `-q --tb=short`, and a
      # second one makes -qq, which suppresses the failure summary and leaves
      # a red run with nothing to read. -rfE restores the short summary of
      # failures and errors. -n auto runs the suite across the runner's cores
      # under pytest-xdist, as every local run does; serially it took 12 min
      # on 2026-09-14, before the suite reached 11,000 tests.
      # A shard takes every fourth test file in git's order, so the four
      # together run each file exactly once; `all` runs the whole tree.
      - name: Tests
        run: |
          if [ "${{ matrix.shard }}" = all ]; then
            python -m pytest -n auto -rfE -m "$MARKS"
          else
            git ls-files tests | grep -E '/test_[^/]*\.py$|_test\.py$' \
              | awk -v n="$SHARDS" -v i="${{ matrix.shard }}" 'NR % n == i' > "$RUNNER_TEMP/shard_files.txt"
            echo "shard ${{ matrix.shard }} of $SHARDS: $(wc -l < "$RUNNER_TEMP/shard_files.txt") test files"
            python -m pytest -n auto -rfE -m "$MARKS" $(cat "$RUNNER_TEMP/shard_files.txt")
          fi

      # A red probe's logs are written under pytest's temporary folder, which
      # the runner discards with the job; kept here, a red is read from its
      # own log rather than rerun in the hope it fails again. The whole
      # LVP_Log folder, not bench_results alone: a capture's give-up line
      # (its wait, the frames handed over and stored, the last frame's age)
      # is written to the LVP log, never to the probe's console.
      - name: Probe logs of a red run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probe-logs-${{ matrix.python-version }}-${{ matrix.shard }}
          path: /tmp/pytest-of-runner/**/test_probe_*/checkout/logs/LVP_Log/**
          if-no-files-found: ignore
          retention-days: 14

      # Every failed test phase's whole report -- its traceback, every log
      # line production wrote during it, its stdout and stderr -- written by
      # tests/conftest.py whatever the console printed: a flake is read from
      # the run it failed in, never rerun in the hope it fails again.
      - name: Failure files of a red run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures-${{ matrix.python-version }}-${{ matrix.shard }}
          path: build/test_failures/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      # --paths, never --staged: nothing is staged in CI, so --staged would
      # check zero files and exit 0 -- a guard that cannot fire.
      - name: Project rules
        run: git ls-files '*.py' '*.kv' | xargs python tools/check_rules.py --paths
