[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q --durations=15"
markers = [
    "requires_led_v2: requires LED firmware v2.0+",
    "requires_motor_v2: requires motor firmware v2.0+",
    "slow: long-running tests (>60s); skip during iteration via `-m \"not slow\"`",
]

[tool.coverage.run]
source = ["modules", "drivers", "ui"]
omit = [
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
]

# Ruff -- Python lint + format. CLAUDE.md Rule 36.
# Source of truth for mechanical conventions; CLAUDE.md wins on disagreement.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "build",
    "dist",
    "logs",
    "capture",
    "data",
    ".venv",
    "*.spec",
    # API usage examples for L2 integrators; illustrative, not shipping code.
    "docs/api_examples",
]

[tool.ruff.lint]
# Default ruff is conservative (E + F). We pick a broader set per Rule 36.
# E   = pycodestyle errors        F   = pyflakes
# W   = pycodestyle warnings      N   = pep8-naming
# UP  = pyupgrade (modern syntax) B   = flake8-bugbear
# A   = flake8-builtins (no shadowing)  C4  = flake8-comprehensions
# PTH = flake8-use-pathlib        RUF = ruff-specific rules
# SIM = flake8-simplify
#
# isort (I / I001) is deliberately NOT selected. Import order can carry
# side-effect dependencies -- Kivy Config/env setup before the kivy import,
# matplotlib backend selection, registration-on-import -- so an alphabetical
# auto-sort risks a test-invisible runtime regression for purely cosmetic
# gain. Rule 26's stdlib / third-party / first-party grouping stays a
# human-review norm; it does not mandate alphabetical order within a group.
select = ["E", "F", "W", "N", "UP", "B", "A", "C4", "PTH", "RUF", "SIM"]

# Unused-import handling: F401 stays in `select` so ruff still flags genuinely
# dead imports for human review, but it is REMOVED from autofix. ruff cannot
# see Kivy `.kv` Factory references, pytest fixture re-exports, conftest
# side-effect imports, or the public `__all__` re-export pattern, so an
# automatic F401 strip is not safe. Verified 2026-05-05: a `ruff check --fix`
# stripped `from ui.shader import ShaderViewer` -- LVP crashed at startup with
# `kivy.factory.FactoryException: Unknown class <ShaderViewer>`. Manual review
# is the only safe pruning path; `unfixable` makes that the only path.
#
# RUF100 (unused noqa) + RUF102 (invalid noqa code) are also unfixable.
# noqa directives are COMMENTS; ruff's job is to improve code, not to
# strip comments automatically. The autofix removes the whole trailing
# comment (any human explanation after the noqa goes with it), so noqa
# cleanup is human-review-only. ruff still REPORTS these for review.
unfixable = ["F401", "RUF100", "RUF102"]

ignore = [
    # E501 (line too long) -- ruff format handles wrapping; raw E501 is noisy.
    "E501",
    # E731 (lambda assignment) -- common Kivy pattern (Clock.schedule_once).
    "E731",
    # B008 (function call in default arg) -- common Kivy idiom.
    "B008",
    # SIM108 (use ternary) -- often hurts readability for non-trivial branches.
    "SIM108",
    # SIM105 (use contextlib.suppress) -- every flagged site is an intentional
    # suppress-and-continue (teardown/atexit paths, listener deregistration,
    # best-effort probes, may-already-be-done USB ops), and roughly a third
    # carry load-bearing trailing comments that a contextlib.suppress rewrite
    # would relocate or orphan. Comments are preserve-by-default; the
    # try/except form keeps them attached to the statement they explain.
    "SIM105",
    # N802 (function lowercase) -- Kivy on_X / on_release / on_value handlers and on_*
    # event names follow Kivy convention; SDK names (Pylon/IDS) use PascalCase too.
    "N802",
    # N803 (argument lowercase) -- some hardware register names are UPPER (HW spec).
    "N803",
    # N806 (variable lowercase) -- same; HW register names + Kivy conventions.
    "N806",
    # N815 (mixedCase classvar) -- Kivy property names follow Kivy convention.
    "N815",
    # A001 / A002 / A003 (builtin shadowing) -- A003 min/max are Kivy
    # NumericProperty names that cannot be renamed; A001/A002 local sum /
    # range / input / format / dir shadows are low-harm. Same class of
    # convention exemption as N802 / N803 / N806 above.
    "A001",
    "A002",
    "A003",
    # PTH (pathlib migration) -- enabled but non-blocking during audit waves; the
    # codebase has substantial os.path usage that migrates incrementally.
    # Specific PTH codes can be re-enabled per directory once migrated.
    "PTH",
]

# Per-file ignores -- carve out legitimate exceptions to specific rules.
[tool.ruff.lint.per-file-ignores]
"lumaviewpro.py" = [
    # Kivy Config.set() must run before kivy import; the entire module
    # body lives inside `if __name__ == "__main__":` so imports follow
    # Config calls by design (Rule 36 config-must-run-first exception).
    "E402",
    # The Factory-import block exists solely so Kivy's Builder can resolve
    # class names referenced from .kv files; ruff cannot see .kv consumers,
    # so every one of those imports reads as unused. The in-file comment at
    # the import block documents the grep-the-.kv-first removal rule.
    "F401",
]
"drivers/camera_profiles.py" = [
    # Profile globals are named after the exact camera model strings
    # (e.g. _daA3840_45um for the Basler daA3840-45um) so a profile is
    # greppable by the model name the camera reports.
    "N816",
]
"tests/*.py" = [
    # Tests use sys.modules monkeypatching at module level by design.
    "E402",
    # Tests use bare assert; B-rules around asserts don't apply.
    "B011",
    # Tests redefine fixtures by name; F811 false-positives.
    "F811",
    # Test classes use the TestIssueNNN_Description underscore convention
    # for readability (which issue / finding the class covers).
    "N801",
]
"drivers/*.py" = [
    # Drivers have hardware register reads/writes with magic numbers; ruff
    # PLR2004 would flag every byte. (Re-evaluate per-driver if PLR is enabled.)
    # Win32 ctypes Structure subclasses (winusb_iso.py) must match the API
    # struct names exactly -- same justification as the N803/N806 HW names.
    "N801",
]
"modules/common_utils.py" = [
    # _PDH_FMT_COUNTERVALUE is a ctypes Structure mirroring the Win32 PDH
    # struct name exactly; cannot be renamed to CapWords.
    "N801",
]
"lvp_logger.py" = [
    # Logging-bootstrap module: appdata-path resolution and logger setup
    # must run before the subsequent imports by design.
    "E402",
]
"modules/lumascope_api/motion.py" = [
    # AxisState import placement is documented in-file as module-top-safe
    # (circular-import ordering); the import follows that explanatory code.
    "E402",
]
"tools/*.py" = [
    # Dev utility scripts insert the repo root on sys.path before importing
    # first-party modules; those imports legitimately follow the setup.
    "E402",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
# Benchmark tooling (non-shipping) keeps its own double-quote style; format
# enforcement is skipped here while ruff check still lints it.
exclude = [
    "stitching_benchmarking/**",
    "scripts/compare_tiling_stitch_sample.py",
]

